{% extends "base.html" %}

{% block conteudo %}

<div class="container mt-4">

<h3>Usuários</h3>

<a href="/usuarios/novo" class="btn btn-primary mb-3">
Novo Usuário
</a>

<table class="table table-bordered table-striped">

<thead>

<tr>
<th>ID</th>
<th>Nome</th>
<th>Usuário</th>
<th>Perfil</th>
<th>Ações</th>
</tr>

</thead>

<tbody>

{% for u in usuarios %}

<tr>

<td>{{ u[0] }}</td>

<td>{{ u[1] }}</td>

<td>{{ u[2] }}</td>

<td>{{ u[3] }}</td>

<td>

<a class="btn btn-warning btn-sm">
Editar
</a>

<a class="btn btn-danger btn-sm">
Excluir
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
