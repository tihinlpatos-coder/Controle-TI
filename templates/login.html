<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Hospitalar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-5">
          <h1 class="h2 fw-bold mb-1">🏥 Sistema Hospitalar</h1>
          <p class="text-muted">Controle de Estoque</p>
          {% if erro %}
          <div class="alert alert-danger">{{ erro }}</div>
          {% endif %}
          <form method="post">
            <div class="mb-3">
              <input class="form-control form-control-lg" name="usuario" placeholder="Usuário">
            </div>
            <div class="mb-3">
              <input type="password" class="form-control form-control-lg" name="senha" placeholder="Senha">
            </div>
            <button class="btn btn-primary btn-lg w-100">Entrar</button>
          </form>
          <div class="mt-4 small text-muted">
            admin / 1234
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
