<div class="container">

```
<div class="row justify-content-center mt-5">

    <div class="col-md-4">

        <div class="card shadow">

            <div class="card-header text-center">
                <h3>Hospital Infantil Noaldo Leite</h3>
                <p>Controle de TI</p>
            </div>

            <div class="card-body">

                {% if erro %}
                <div class="alert alert-danger">
                    {{ erro }}
                </div>
                {% endif %}

                <form method="POST">

                    <div class="mb-3">
                        <label>Usuário</label>
                        <input
                            type="text"
                            name="usuario"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Senha</label>
                        <input
                            type="password"
                            name="senha"
                            class="form-control"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
```

</div>

</body>
</html>
