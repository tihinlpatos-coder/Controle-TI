<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Sistema Hospitalar</title>
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">
          <h2 class="mb-1">🏥 Sistema Hospitalar</h2>
          <p class="text-muted">Controle de Estoque</p>
          {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
          <form method="post">
            <input class="form-control mb-3" name="usuario" placeholder="Usuário">
            <input class="form-control mb-3" type="password" name="senha" placeholder="Senha">
            <button class="btn btn-primary w-100">Entrar</button>
          </form>
          <small class="text-muted d-block mt-3">Usuário: admin | Senha: 1234</small>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
