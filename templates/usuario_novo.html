{% extends "base.html" %}

{% block conteudo %}

<div class="container mt-4">

<h2>Novo Usuário</h2>

<form method="POST">

<div class="mb-3">

<label>Nome</label>

<input
type="text"
name="nome"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Usuário</label>

<input
type="text"
name="usuario"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Senha</label>

<input
type="password"
name="senha"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Perfil</label>

<select
name="perfil"
class="form-control">

<option>ADMIN</option>

<option>TECNICO</option>

<option>USUARIO</option>

</select>

</div>

<button class="btn btn-success">

Salvar

</button>

<a href="{{ url_for('usuarios') }}" class="btn btn-secondary">

Cancelar

</a>

</form>

</div>

{% endblock %}
